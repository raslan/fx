name: Canary

on:
  push:
    branches:
      - develop

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Record previous canary version
        id: prev_canary
        run: echo "version=$(npm view @aliraslan/fx dist-tags.canary 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Version as canary snapshot
        run: npm version "0.0.0-canary-$(git rev-parse --short HEAD)" --no-git-tag-version

      - name: Publish canary
        run: npm publish --tag canary --provenance
        env:
          NPM_CONFIG_PROVENANCE: true

      # Deprecate is best-effort: OIDC trusted publishing only covers
      # `npm publish`, so this may not be authenticated the same way and
      # can fail — that must never take down the publish step above it.
      - name: Deprecate previous canary
        if: ${{ steps.prev_canary.outputs.version != '' }}
        run: npm deprecate "@aliraslan/fx@${{ steps.prev_canary.outputs.version }}" "superseded by a newer canary build" || true
