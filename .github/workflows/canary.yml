name: Canary

on:
  push:
    branches:
      - develop

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Version as canary snapshot
        run: npm version "0.0.0-canary-$(git rev-parse --short HEAD)" --no-git-tag-version

      - name: Publish canary
        run: npm publish --tag canary --provenance
        env:
          NPM_CONFIG_PROVENANCE: true
